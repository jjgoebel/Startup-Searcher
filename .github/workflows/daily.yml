name: Daily collection

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install -r requirements.txt

      - name: Collect HN posts
        run: venv/bin/python collect_hn.py

      - name: Collect GitHub repos
        run: venv/bin/python collect_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate report
        run: venv/bin/python make_report.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add startups.db reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
